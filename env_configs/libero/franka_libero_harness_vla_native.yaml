# Harness VLA configuration using the minimal native-model + identity-action adapter pair.
# Start a compatible VLA inference service on port 8123 before running this config.

env:
  _target_: capx.envs.tasks.franka.franka_libero_env.FrankaLiberoCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level:
      _target_: capx.envs.simulators.libero.FrankaLiberoEnv
      suite_name: libero_object_swap
      task_id: 0
      privileged: false
      max_steps: 8000
      control_freq: 20
    privileged: false
    apis:
      - FrankaLiberoApiReduced
      - name: VlaPrimitiveApi
        config:
          model:
            type: http
            adapter:
              name: native
            transport:
              base_url: http://127.0.0.1:8123
              timeout: 120
          action_adapter:
            name: identity
          primitive:
            default_max_chunks: 2
    prompt: |
      You are controlling a Franka Emika robot with the APIs described below.
      Goal: {libero_environment_goal}
      Use analytic APIs for perception, staging, transport, release, and recovery.
      Use vla_act only for local contact-rich phases, then inspect the new observation.
      Write only executable Python code without Markdown fences.
    multi_turn_prompt: |
      The following code blocks were just executed:
      ```python
      {executed_code}
      ```
      Console stdout:
      ```
      {console_stdout}
      ```
      Console stderr:
      ```
      {console_stderr}
      ```
      Respond with exactly REGENERATE followed by a Python code block to continue, or FINISH.

api_servers:
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand
  - _target_: capx.serving.launch_contact_graspnet_server.main
    port: 8115
    host: 127.0.0.1
  - _target_: capx.serving.launch_sam3_server.main
    device: cuda
    port: 8114
    host: 127.0.0.1

record_video: true
use_img_differencing: true
output_dir: ./outputs/franka_libero_harness_vla_native
trials: 50
num_workers: 4
